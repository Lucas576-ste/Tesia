name: Backup diário do banco

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar dump criptografado
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_DATABASE_URL" && test -n "$BACKUP_SENHA"
          arquivo="tesia-$(date -u +%Y-%m-%d).dump.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$BACKUP_DATABASE_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase-fd 3 3<<<"$BACKUP_SENHA" -o "$arquivo"
          test -s "$arquivo"
          echo "ARQUIVO=$arquivo" >> "$GITHUB_ENV"

      - name: Guardar por 30 dias
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.ARQUIVO }}
          path: ${{ env.ARQUIVO }}
          retention-days: 30
          if-no-files-found: error
